[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xavierlabs-ai"
version = "0.1.0"
description = "Autonomous, terminal-native computational scientific research engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "XavierLabs Team" }
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "litellm>=1.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlmodel>=0.0.18",
    "httpx>=0.27.0",
    "arxiv>=2.1.0",
    "duckduckgo-search>=6.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
xavier = "xavierlabs.cli:app"
xavierlabs = "xavierlabs.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["xavierlabs*"]
