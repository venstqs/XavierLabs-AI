<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="auto" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#569cd6" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#4ec9b0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <mask id="xl-cut">
      <rect width="40" height="40" fill="#fff"/>
      <polygon points="2.4,36 11.6,36 31.41,4 22.21,4" fill="#000"/>
    </mask>
  </defs>

  <!-- Pitch-black card base -->
  <rect width="840" height="200" rx="16" fill="#000000"/>
  <rect width="840" height="200" rx="16" fill="url(#glow)"/>
  <rect width="840" height="200" rx="16" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="838.5" height="198.5" rx="15.25" stroke="#1f1f24" stroke-width="1.5"/>

  <!-- Official XavierLabs geometric mark + wordmark lockup -->
  <g transform="translate(226, 48)">
    <!-- Rounded white emblem -->
    <rect width="52" height="52" rx="13" fill="#f5f5f7"/>
    <g transform="translate(9.1, 9.1) scale(0.845)">
      <g transform="translate(6.33, 0) skewX(-10)" fill="#000000">
        <polygon points="30.0,36 36.0,36 16.19,4 10.19,4" mask="url(#xl-cut)"/>
        <polygon points="4.0,36 10.0,36 29.81,4 23.81,4"/>
        <rect x="12.076" y="25.8" width="15.848" height="4.0"/>
      </g>
    </g>

    <!-- Wordmark -->
    <text x="68" y="38" fill="#f5f5f7" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="600" letter-spacing="-1.4">XavierLabs</text>

    <!-- VS Code syntax badge: agent.swarm() -->
    <g transform="translate(278, 12)">
      <rect width="118" height="28" rx="14" fill="#0d0d10" stroke="#26262e" stroke-width="1"/>
      <text x="59" y="18.5" text-anchor="middle" font-family="'Geist Mono', 'JetBrains Mono', monospace" font-size="12" font-weight="500">
        <tspan fill="#569cd6">agent</tspan><tspan fill="#808080">.</tspan><tspan fill="#dcdcaa">swarm</tspan><tspan fill="#9898a2">()</tspan>
      </text>
    </g>
  </g>

  <!-- VS Code syntax-colored subtitle -->
  <text x="420" y="138" text-anchor="middle" font-family="'Geist Mono', 'JetBrains Mono', monospace" font-size="13.5">
    <tspan fill="#6a9955">// </tspan>
    <tspan fill="#9898a2">autonomous computational research · </tspan>
    <tspan fill="#4ec9b0">ArXiv</tspan>
    <tspan fill="#63636e"> → </tspan>
    <tspan fill="#dcdcaa">Docker Sandbox</tspan>
    <tspan fill="#63636e"> → </tspan>
    <tspan fill="#ce9178">LaTeX / PDF</tspan>
  </text>

  <!-- Install command pill at bottom -->
  <g transform="translate(215, 154)">
    <rect width="410" height="28" rx="8" fill="#09090b" stroke="#1f1f24" stroke-width="1"/>
    <text x="205" y="18.5" text-anchor="middle" font-family="'Geist Mono', 'JetBrains Mono', monospace" font-size="11.5">
      <tspan fill="#63636e">$ </tspan>
      <tspan fill="#dcdcaa">pip</tspan>
      <tspan fill="#569cd6"> install </tspan>
      <tspan fill="#ce9178">git+https://github.com/venstqs/XavierLabs-AI.git</tspan>
    </text>
  </g>
</svg>
